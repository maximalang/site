name: agent-world

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_world
      POSTGRES_USER: agent_world
      POSTGRES_PASSWORD: ${AGENT_WORLD_POSTGRES_PASSWORD:?set AGENT_WORLD_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=agent_world --dbname=agent_world"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-world-web:${AGENT_WORLD_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent_world:${AGENT_WORLD_POSTGRES_PASSWORD}@postgres:5432/agent_world
      AGENT_WORLD_DATABASE_TLS: disable
      AGENT_WORLD_DATABASE_PLAINTEXT_ACK: private-network
      AGENT_WORLD_OWNER_PASSWORD_HASH: ${AGENT_WORLD_OWNER_PASSWORD_HASH:?set AGENT_WORLD_OWNER_PASSWORD_HASH}
      AGENT_WORLD_CSRF_SECRET: ${AGENT_WORLD_CSRF_SECRET:?set AGENT_WORLD_CSRF_SECRET}
      AGENT_WORLD_SECRET_MASTER_KEY: ${AGENT_WORLD_SECRET_MASTER_KEY:?set AGENT_WORLD_SECRET_MASTER_KEY}
      AGENT_WORLD_SECRET_KEY_VERSION: ${AGENT_WORLD_SECRET_KEY_VERSION:-1}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${AGENT_WORLD_LITELLM_MASTER_KEY:?set AGENT_WORLD_LITELLM_MASTER_KEY}
      AGENT_WORLD_RAG_EMBEDDING_MODEL_ROUTE_ID: ${AGENT_WORLD_RAG_EMBEDDING_MODEL_ROUTE_ID:-}
      AGENT_WORLD_INSTANCE_ID: ${AGENT_WORLD_INSTANCE_ID:-agent-world}
      AGENT_WORLD_MCP_ENABLED: ${AGENT_WORLD_MCP_ENABLED:-false}
      AGENT_WORLD_MCP_RESOURCE: ${AGENT_WORLD_MCP_RESOURCE:-}
      AGENT_WORLD_MCP_OAUTH_ISSUER: ${AGENT_WORLD_MCP_OAUTH_ISSUER:-}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_DEVICE_TOKEN: ${OPENCLAW_GATEWAY_DEVICE_TOKEN:-}
      AGENT_WORLD_GRAPHITI_MCP_URL: ${AGENT_WORLD_GRAPHITI_MCP_URL:-}
      AGENT_WORLD_GRAPHITI_PLAINTEXT_ACK: ${AGENT_WORLD_GRAPHITI_PLAINTEXT_ACK:-}
      AGENT_WORLD_GRAPHITI_POLL_MS: ${AGENT_WORLD_GRAPHITI_POLL_MS:-5000}
      AGENT_WORLD_MISSION_HANDOFF_POLL_MS: ${AGENT_WORLD_MISSION_HANDOFF_POLL_MS:-5000}
      AGENT_WORLD_INTEGRATION_ALLOWED_HOSTS: ${AGENT_WORLD_INTEGRATION_ALLOWED_HOSTS:-}
      AGENT_WORLD_INTEGRATION_PRIVATE_NETWORK_ACK: ${AGENT_WORLD_INTEGRATION_PRIVATE_NETWORK_ACK:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - edge
      - data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  native-chat-auth:
    profiles: ["native-chat"]
    build:
      context: .
      dockerfile: apps/native-chat-auth/Dockerfile
    image: agent-world-native-chat-auth:${AGENT_WORLD_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent_world:${AGENT_WORLD_POSTGRES_PASSWORD}@postgres:5432/agent_world
      AGENT_WORLD_MCP_AUTH_PROVIDER: local_oidc
      AGENT_WORLD_MCP_RESOURCE: ${AGENT_WORLD_MCP_RESOURCE:-}
      AGENT_WORLD_MCP_OAUTH_ISSUER: ${AGENT_WORLD_MCP_OAUTH_ISSUER:-}
      AGENT_WORLD_OWNER_PASSWORD_HASH: ${AGENT_WORLD_OWNER_PASSWORD_HASH:?set AGENT_WORLD_OWNER_PASSWORD_HASH}
      AGENT_WORLD_MCP_OAUTH_JWKS_FILE: /run/secrets/oauth-jwks.json
      AGENT_WORLD_MCP_OAUTH_COOKIE_KEYS_FILE: /run/secrets/oauth-cookie-keys.json
    volumes:
      - ${AGENT_WORLD_MCP_OAUTH_JWKS_FILE:-./ops/secrets/disabled-oauth-jwks.json}:/run/secrets/oauth-jwks.json:ro
      - ${AGENT_WORLD_MCP_OAUTH_COOKIE_KEYS_FILE:-./ops/secrets/disabled-oauth-cookie-keys.json}:/run/secrets/oauth-cookie-keys.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    networks:
      - edge
      - data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  codex-worker:
    build:
      context: .
      dockerfile: Dockerfile.codex-worker
    image: agent-world-codex-worker:${AGENT_WORLD_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent_world:${AGENT_WORLD_POSTGRES_PASSWORD}@postgres:5432/agent_world
      AGENT_WORLD_DATABASE_TLS: disable
      AGENT_WORLD_DATABASE_PLAINTEXT_ACK: private-network
      AGENT_WORLD_CODEX_ALLOWED_ROOTS: /workspaces/project
      AGENT_WORLD_CODEX_EXECUTABLE: /app/node_modules/.bin/codex
      AGENT_WORLD_CODEX_WORKER_ID: ${AGENT_WORLD_CODEX_WORKER_ID:-codex-worker-1}
      AGENT_WORLD_CODEX_ACCOUNT_ID: ${AGENT_WORLD_CODEX_ACCOUNT_ID:?Set the canonical ChatGPT Account ID}
      AGENT_WORLD_CODEX_LEASE_MS: ${AGENT_WORLD_CODEX_LEASE_MS:-60000}
      AGENT_WORLD_CODEX_POLL_MS: ${AGENT_WORLD_CODEX_POLL_MS:-2000}
    volumes:
      - ${AGENT_WORLD_CODEX_PROJECT_ROOT:-.}:/workspaces/project:rw
      - codex_state:/var/lib/agent-world/codex
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    networks:
      - data
      - egress
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 2048m
    cpus: 2.0
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  litellm:
    image: ghcr.io/berriai/litellm@sha256:154e23bb5f31b1f10e16392a8ef299bd2cde08de3a64a6849002cfcc25ce3c63
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${AGENT_WORLD_LITELLM_MASTER_KEY:?set AGENT_WORLD_LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${AGENT_WORLD_LITELLM_SALT_KEY:?set AGENT_WORLD_LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://agent_world:${AGENT_WORLD_POSTGRES_PASSWORD}@postgres:5432/agent_world
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./ops/litellm-config.yaml:/app/config.yaml:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    networks:
      - data
      - egress
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 60s
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  falkordb:
    profiles: ["graph-memory"]
    image: falkordb/falkordb:v4.20.1@sha256:9042fdc4e53f5390ca5a3993aa71506523970efb40ffb9a98e6a4b1a9a4f8862
    restart: unless-stopped
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 9
      start_period: 20s
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  graphiti:
    profiles: ["graph-memory"]
    build:
      context: .
      dockerfile: ops/graphiti/Dockerfile
    image: agent-world-graphiti:0.29.3
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      FALKORDB_URI: redis://falkordb:6379
      FALKORDB_DATABASE: agent_world_memory
      OPENAI_API_KEY: ${AGENT_WORLD_LITELLM_MASTER_KEY:?set AGENT_WORLD_LITELLM_MASTER_KEY}
      OPENAI_API_URL: http://litellm:4000/v1
      MODEL_NAME: ${AGENT_WORLD_GRAPHITI_MODEL:-gpt-5-mini}
      EMBEDDER_MODEL: ${AGENT_WORLD_GRAPHITI_EMBEDDER_MODEL:-text-embedding-3-small}
      EMBEDDER_DIMENSIONS: ${AGENT_WORLD_GRAPHITI_EMBEDDER_DIMENSIONS:-1536}
      SEMAPHORE_LIMIT: ${AGENT_WORLD_GRAPHITI_CONCURRENCY:-2}
      GRAPHITI_TELEMETRY_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD",
          "/app/mcp/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_WORLD_SITE_ADDRESS: ${AGENT_WORLD_SITE_ADDRESS:-https://localhost}
    ports:
      - "${AGENT_WORLD_HTTP_PORT:-80}:80"
      - "${AGENT_WORLD_HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - edge
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  data:
    internal: true
  egress:

volumes:
  postgres_data:
  codex_state:
  caddy_data:
  caddy_config:
  falkordb_data: