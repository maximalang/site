server:
  transport: http
  host: 0.0.0.0
  port: 8000

llm:
  provider: openai
  model: ${MODEL_NAME:gpt-5-mini}
  max_tokens: 4096
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:http://litellm:4000/v1}

embedder:
  provider: openai
  model: ${EMBEDDER_MODEL:text-embedding-3-small}
  dimensions: ${EMBEDDER_DIMENSIONS:1536}
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:http://litellm:4000/v1}

database:
  provider: falkordb
  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://falkordb:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:agent_world_memory}

graphiti:
  group_id: bootstrap-only
  episode_id_prefix: ""
  user_id: agent-world-projector
