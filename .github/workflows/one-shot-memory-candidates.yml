name: One-shot memory candidate cleanup

on:
  push:
    branches:
      - codex/memory-inbox-exact-candidates

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/memory-inbox-exact-candidates
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Fix and format memory candidate change
        run: |
          sed -i 's/memory\.context_item_id`/memory.id`/' packages/postgres-store/src/memory-center-reader.ts
          npx biome format --write packages/domain/src/memory.ts packages/domain/src/memory.test.ts packages/postgres-store/src/memory-center-reader.ts packages/postgres-store/src/memory-center-reader.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-memory-candidates.yml
          git add packages/domain/src/memory.ts packages/domain/src/memory.test.ts packages/postgres-store/src/memory-center-reader.ts packages/postgres-store/src/memory-center-reader.test.ts
          git commit -m 'Normalize memory candidate implementation'
          git push origin HEAD:codex/memory-inbox-exact-candidates
