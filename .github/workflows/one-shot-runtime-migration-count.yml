name: One-shot runtime migration count fix

on:
  push:
    branches:
      - codex/memory-supersession

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/memory-supersession
          fetch-depth: 0
      - name: Update exact runtime migration evidence
        run: |
          sed -i 's/evidence.rows\[0\]?\.migrations !== 43/evidence.rows[0]?.migrations !== 44/' apps/web/scripts/verify-runtime-isolated.mjs
          sed -i 's/migrations: 43/migrations: 44/' apps/web/scripts/verify-runtime-isolated.mjs
          rm .github/workflows/one-shot-runtime-migration-count.yml
      - name: Commit exact verifier fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Update runtime migration evidence for supersession'
          git push origin HEAD:codex/memory-supersession
