name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/phase-1-contracts

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:lockfile
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:db
        env:
          AGENT_WORLD_DB_TEST_ACK: isolated
      - run: npm run test:runtime
        env:
          AGENT_WORLD_RUNTIME_TEST_ACK: isolated

  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:orchestration
        env:
          AGENT_WORLD_LANGGRAPH_TEST_ACK: isolated

  openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:openclaw-live
        env:
          AGENT_WORLD_OPENCLAW_LIVE_TEST_ACK: isolated

  litellm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:litellm-live
        env:
          AGENT_WORLD_LITELLM_LIVE_TEST_ACK: isolated

  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:codex-live
        env:
          AGENT_WORLD_CODEX_LIVE_TEST_ACK: isolated

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_WORLD_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify preinstalled Google Chrome
        run: google-chrome --version
      - run: npm run test:e2e
      - name: Verify local laptop preview and capture Phase 6 AI Town evidence
        shell: bash
        run: |
          set -euo pipefail
          node apps/web/scripts/local-preview.mjs --no-open >"$RUNNER_TEMP/local-preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          node <<'NODE'
          const base = "http://127.0.0.1:3210";
          for (let attempt = 0; attempt < 180; attempt += 1) {
            try {
              const response = await fetch(base, { signal: AbortSignal.timeout(750) });
              if (response.ok) break;
            } catch {}
            if (attempt === 179) throw new Error("Local preview did not become ready");
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          const session = await fetch(`${base}/api/auth/session`);
          if (!session.ok || session.headers.get("x-agent-world-preview") !== "contract-fixture") {
            throw new Error("Local preview session fixture is unavailable");
          }
          const worldResponse = await fetch(`${base}/api/world`);
          const world = await worldResponse.json();
          if (!worldResponse.ok || world.source !== "CONTRACT_FIXTURE") {
            throw new Error("Local preview World fixture is invalid");
          }
          const hubResponse = await fetch(`${base}/api/hub`);
          const hub = await hubResponse.json();
          if (!hubResponse.ok || hub.schemaVersion !== 1 || hub.projects?.length !== 1) {
            throw new Error("Local preview Hub fixture is invalid");
          }
          const mutation = await fetch(`${base}/api/tasks`, { method: "POST" });
          if (mutation.status !== 409) {
            throw new Error("Local preview must fail closed for mutations");
          }
          NODE
          AGENT_WORLD_EVIDENCE_BASE_URL=http://127.0.0.1:3210 \
            node apps/web/scripts/phase6-ai-town-visual-evidence.mjs
      - name: Upload browser visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-visual-evidence-${{ github.sha }}
          path: apps/web/test-results/**/*.png
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_WORLD_POSTGRES_PASSWORD: isolated_ci_postgres_password_1234567890
      AGENT_WORLD_CSRF_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AGENT_WORLD_SECRET_MASTER_KEY: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
      AGENT_WORLD_SECRET_KEY_VERSION: 1
      AGENT_WORLD_LITELLM_MASTER_KEY: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
      AGENT_WORLD_LITELLM_SALT_KEY: DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
      AGENT_WORLD_OWNER_PASSWORD_HASH: 'scrypt-v1$32768$8$1$AAAAAAAAAAAAAAAAAAAAAA$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
      AGENT_WORLD_SITE_ADDRESS: https://localhost
      AGENT_WORLD_COMPOSE_TEST_ACK: isolated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm run test:compose
