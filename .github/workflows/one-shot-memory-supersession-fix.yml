name: One-shot memory supersession fix

on:
  push:
    branches:
      - codex/memory-supersession

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/memory-supersession
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Apply exact verifier and formatting fixes
        run: |
          sed -i 's/ledger.rows.at(-1)?.version !== 43/ledger.rows.at(-1)?.version !== 44/' packages/postgres-store/scripts/verify-isolated.mjs
          npx biome check --write packages/domain/src/memory.ts packages/domain/src/memory.test.ts packages/postgres-store/src/memory-curation-store.ts packages/postgres-store/src/memory-curation-store.test.ts packages/postgres-store/src/memory-center-reader.ts packages/postgres-store/src/memory-projection-store.ts packages/postgres-store/src/migration.test.ts
          rm .github/workflows/one-shot-memory-supersession-fix.yml
      - name: Commit exact fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix supersession verification and formatting'
          git push origin HEAD:codex/memory-supersession
