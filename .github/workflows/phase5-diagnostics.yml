name: Phase 5 diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.15.0
  AGENT_WORLD_PLAYWRIGHT_CHANNEL: chrome

jobs:
  phase5-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify preinstalled Google Chrome
        run: google-chrome --version
      - name: Capture deterministic 1024 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node apps/web/scripts/local-preview.mjs --no-open >"$RUNNER_TEMP/local-preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          node <<'NODE'
          const base = "http://127.0.0.1:3210";
          for (let attempt = 0; attempt < 180; attempt += 1) {
            try {
              const response = await fetch(`${base}/api/auth/session`, {
                signal: AbortSignal.timeout(750),
              });
              if (
                response.ok &&
                response.headers.get("x-agent-world-preview") === "contract-fixture"
              ) {
                process.exit(0);
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          throw new Error("Local preview did not become ready");
          NODE
          AGENT_WORLD_EVIDENCE_BASE_URL=http://127.0.0.1:3210 \
          AGENT_WORLD_1024_DIAGNOSTIC_LABEL=manual \
            node apps/web/scripts/phase5-1024-evidence.mjs
      - name: Upload Phase 5 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-1024-diagnostics-${{ github.sha }}
          path: apps/web/test-results/phase5-1024-evidence/**
          if-no-files-found: error
          retention-days: 14
