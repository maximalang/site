name: Phase 6 formatter

on:
  push:
    branches:
      - codex/phase-6-ai-town-world-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/phase-6-ai-town-world-ui
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Apply Phase 6 corrections and formatter
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          css = Path("apps/web/src/components/phase6-world.module.css")
          css.write_text(css.read_text().replace("!important", ""))

          renderer = Path("apps/web/src/components/openclaw-office-world.tsx")
          text = renderer.read_text()
          text = text.replace(
              "trees.forEach(([x, y], index) => tree(ctx, x, y, index % 2 === 0));",
              "trees.forEach(([x, y], index) => { tree(ctx, x, y, index % 2 === 0); });",
          )
          text = text.replace(
              '<div aria-label="Управление картой" className={styles.controls}>',
              '<div aria-label="Управление картой" className={styles.controls} role="group">',
          )
          text = text.replace(
              "const mapRef = useRef<HTMLCanvasElement>();",
              "const mapRef = useRef<HTMLCanvasElement | undefined>(undefined);",
          )
          text = text.replace(
              "const dragRef = useRef<{ id: number; start: WorldPoint; camera: Camera; moved: boolean }>();",
              "const dragRef = useRef<{ id: number; start: WorldPoint; camera: Camera; moved: boolean } | undefined>(undefined);",
          )
          text = text.replace(
              "const pinchRef = useRef<{ distance: number; zoom: number }>();",
              "const pinchRef = useRef<{ distance: number; zoom: number } | undefined>(undefined);",
          )
          renderer.write_text(text)

          presentation = Path("apps/web/src/components/world-presentation.ts")
          text = presentation.read_text().replace(
              'export function statusTargetZone(status: AgentProjectionCore["status"]): PresentationZone {',
              'export function statusTargetZone(\n  status: AgentProjectionCore["status"],\n): Exclude<PresentationZone, "COLLABORATION"> {',
          )
          presentation.write_text(text)

          presentation_test = Path("apps/web/src/components/world-presentation.test.ts")
          text = presentation_test.read_text()
          branded = {
              'agentId: "agent_11111111-1111-1111-1111-111111111111",':
                  'agentId: "agent_11111111-1111-1111-1111-111111111111" as AgentProjectionCore["agentId"],',
              'id: "event_bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb",':
                  'id: "event_bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb" as WorldHandoff["id"],',
              'missionId: "mission_cccccccc-cccc-cccc-cccc-cccccccccccc",':
                  'missionId: "mission_cccccccc-cccc-cccc-cccc-cccccccccccc" as WorldHandoff["missionId"],',
              'fromTaskId: "task_44444444-4444-4444-4444-444444444444",':
                  'fromTaskId: "task_44444444-4444-4444-4444-444444444444" as WorldHandoff["fromTaskId"],',
              'toTaskId: "task_aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa",':
                  'toTaskId: "task_aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" as WorldHandoff["toTaskId"],',
              'fromRunId: "run_dddddddd-dddd-dddd-dddd-dddddddddddd",':
                  'fromRunId: "run_dddddddd-dddd-dddd-dddd-dddddddddddd" as WorldHandoff["fromRunId"],',
              'toAgentId: "agent_22222222-2222-2222-2222-222222222222",':
                  'toAgentId: "agent_22222222-2222-2222-2222-222222222222" as WorldHandoff["toAgentId"],',
          }
          for old, new in branded.items():
              text = text.replace(old, new)
          presentation_test.write_text(text)

          control = Path("apps/web/tests/control-center.spec.ts")
          text = control.read_text()
          old = '''  const brandSubtitle = page.getByText("Операторская среда", { exact: true });
          if ((page.viewportSize()?.width ?? 1440) <= 640) {
            await expect(brandSubtitle).toBeHidden();
          } else {
            await expect(brandSubtitle).toBeVisible();
          }
          await expect(page.getByText("Тестовые данные", { exact: true })).toBeVisible();
          await expect(page.getByRole("note")).toContainText("тестовые данные");
          await expect(page.getByRole("note")).toContainText("не отражает состояние Runtime");
          await expect(page.locator("main")).toHaveCount(1);
          await expect(page.getByText("Research Lead → Reviewer", { exact: true })).toBeVisible();
          await expect(page.locator("[data-handoff-cue]")).toHaveCount(1);
          '''
          new = '''  const brandSubtitle = page.getByText("Операторская среда", { exact: true });
          await expect(brandSubtitle).toBeHidden();
          await expect(page.getByRole("note")).toContainText("тестовые данные");
          await expect(page.getByRole("note")).toContainText("не отражает состояние Runtime");
          await expect(page.locator("main")).toHaveCount(1);
          const worldRenderer = page.locator('[data-renderer="agent-world-canvas-v1"]');
          await expect(worldRenderer).toBeVisible();
          await expect(page.getByTestId("agent-world-canvas")).toBeVisible();
          await expect(page.getByLabel("Вид карты")).toHaveCount(0);
          await expect(page.locator("[data-handoff-cue]")).toHaveCount(0);
          await page.getByRole("button", { name: "Показать передачу" }).click();
          await expect(page.getByText("Передача: Research Lead → Reviewer", { exact: true })).toBeVisible();
          await expect(page.locator("[data-handoff-cue]")).toHaveCount(1);
          '''
          if old not in text:
              raise SystemExit("control-center Phase 5 assertion block not found")
          control.write_text(text.replace(old, new))

          memory = Path("apps/web/tests/world-memory.spec.ts")
          text = memory.read_text().replace(
              'test("World skin preference and Memory Network remain canonical in the browser", async ({',
              'test("World renderer and Memory Network remain canonical in the browser", async ({',
          )
          start = '  const skinSelector = page.getByLabel("Вид карты");\n'
          end = '  await page.getByRole("tab", { name: "Hub" }).click();\n'
          if start not in text or end not in text:
              raise SystemExit("world-memory Phase 5 skin block not found")
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = '''  const worldRenderer = page.locator('[data-renderer="agent-world-canvas-v1"]');
          await expect(worldRenderer).toBeVisible();
          await expect(page.getByTestId("agent-world-canvas")).toBeVisible();
          await expect(page.getByLabel("Вид карты")).toHaveCount(0);
          await expect(page.getByRole("button", { name: "Сбросить" })).toHaveCount(0);
          await expect(page.getByRole("button", { name: /^Research Lead:/ })).toBeVisible();
          expect(
            await page.evaluate(
              () => document.documentElement.scrollWidth <= document.documentElement.clientWidth,
            ),
          ).toBe(true);
          expect(await page.evaluate(() => localStorage.getItem("agent-world.office-skin.v1"))).toBeNull();
          await page.screenshot({
            animations: "disabled",
            caret: "hide",
            fullPage: true,
            path: testInfo.outputPath(`${testInfo.project.name}-world-ai-town.png`),
          });

          await page.getByRole("tab", { name: "Hub" }).click();
          '''
          memory.write_text(before + replacement + after)
          PY
          npm run format
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components apps/web/scripts apps/web/tests
          git commit -m "Phase 6: format and update World assertions"
          git push origin HEAD:codex/phase-6-ai-town-world-ui
