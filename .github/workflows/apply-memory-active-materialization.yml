name: Apply memory active materialization patch

on:
  pull_request:
    branches:
      - codex/phase-1-contracts
  push:
    branches:
      - codex/memory-active-materialization-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/memory-active-materialization-v2
      - name: Apply fail-safe fallback filter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/postgres-store/src/memory-curation-store.ts")
          text = path.read_text()
          pattern = re.compile(
              r"(?P<where>\s+WHERE proposal\.id = \$2 AND proposal\.project_id = \$4\n)"
              r"(?P<tail>\s+AND NOT EXISTS \(SELECT 1 FROM inserted\)\n\s+LIMIT 1`,)"
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one materialization fallback block, found {len(matches)}")
          replacement = (
              matches[0].group("where")
              + "              AND memory.created_at <= $3\n"
              + "              AND (memory.valid_until IS NULL OR memory.valid_until > $3)\n"
              + matches[0].group("tail")
          )
          text = text[: matches[0].start()] + replacement + text[matches[0].end() :]
          path.write_text(text)
          PY
          rm .github/workflows/apply-memory-active-materialization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/postgres-store/src/memory-curation-store.ts .github/workflows/apply-memory-active-materialization.yml
          git commit -m "Require active fallback memory materialization"
          git push origin HEAD:codex/memory-active-materialization-v2
